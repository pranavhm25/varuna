<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Varuna</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <script>
    /* GitHub Pages serves this file for any missing path, including deep ones,
       so every relative path is resolved from the site root instead. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = document.createElement("base");
      base.href = /\.github\.io$/.test(location.hostname) && parts.length ? "/" + parts[0] + "/" : "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">
</head>
<body>
  <main class="container" id="main">
    <section class="not-found">
      <p class="eyebrow">404</p>
      <h1 class="heading-2">This reading does not exist.</h1>
      <p class="body-2 not-found-copy">The page you asked for is not here. The overview still is.</p>
      <a class="btn" href="index.html">Back to Varuna</a>
    </section>
  </main>
</body>
</html>
