[theme]
# Night-mode base of the Varuna design system, the app's default theme. The
# application applies its own token layer for both themes at runtime; these values
# keep native widgets and the initial paint consistent with the dark palette.
base = "dark"
primaryColor = "#79B0CB"
backgroundColor = "#071A21"
secondaryBackgroundColor = "#0C2229"
textColor = "#EAE5D8"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
